
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teoria do Direito</title>
  <link rel="stylesheet" href="direito.css">
</head>

<body>
  <header>
    <h1>Teoria do Direito</h1>
    <p>Minha biblioteca de estudos</p>
  </header>

  <main>
    <p>
      <a href="direito.html">← Voltar ao currículo</a>
    </p>

    <h2>Biblioteca da disciplina</h2>

    <!-- Campo de busca -->
    <input
      type="search"
      id="busca-documentos"
      placeholder="Buscar por título, categoria ou descrição..."
      aria-label="Buscar documentos"
    >

    <!-- Filtro por categoria -->
    <select id="filtro-categoria" aria-label="Filtrar por categoria">
      <option value="">Todas as categorias</option>
      <option value="Texto de estudo">Textos de estudo</option>
      <option value="Resumo">Resumos</option>
      <option value="Exercício">Exercícios</option>
      <option value="Mapa conceitual">Mapas conceituais</option>
    </select>

    <!-- Mensagem de carregamento e resultados -->
    <p id="estado-documentos" role="status">
      Carregando documentos...
    </p>

    <!-- Os documentos serão inseridos aqui pelo JavaScript -->
    <section
      id="lista-documentos"
      class="lista-documentos"
    ></section>

    <h2>Resumos e anotações</h2>
    <p>
      Em breve, meus resumos aparecerão aqui.
    </p>
  </main>

  <script>
    async function carregarDocumentos() {
      const estado = document.getElementById("estado-documentos");
      const lista = document.getElementById("lista-documentos");
      const busca = document.getElementById("busca-documentos");
      const filtroCategoria = document.getElementById("filtro-categoria");

      try {
        const resposta = await fetch("./documentos.json");

        if (!resposta.ok) {
          throw new Error("Não foi possível carregar documentos.json.");
        }

        const documentos = await resposta.json();

        function exibirDocumentos() {
          const termo = busca.value
            .trim()
            .toLocaleLowerCase("pt-BR");

          const categoriaSelecionada = filtroCategoria.value;

          const filtrados = documentos.filter((doc) => {
            const texto = [
              doc.titulo,
              doc.categoria,
              doc.descricao
            ]
              .filter(Boolean)
              .join(" ")
              .toLocaleLowerCase("pt-BR");

            return (
              doc.disciplina === "Teoria do Direito" &&
              texto.includes(termo) &&
              (
                categoriaSelecionada === "" ||
                doc.categoria === categoriaSelecionada
              )
            );
          });

          lista.replaceChildren();

          filtrados.forEach((doc) => {
            const artigo = document.createElement("article");
            artigo.className = "documento";

            const titulo = document.createElement("h3");
            titulo.textContent = doc.titulo || "Documento sem título";

            const categoria = document.createElement("p");
            categoria.textContent =
              "Categoria: " + (doc.categoria || "Não informada");

            const descricao = document.createElement("p");
            descricao.textContent =
              doc.descricao || "Sem descrição.";

            artigo.append(titulo, categoria, descricao);

            if (doc.arquivo) {
              const link = document.createElement("a");
              link.href = doc.arquivo;
              link.textContent = "Abrir PDF";
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              artigo.appendChild(link);
            }

            lista.appendChild(artigo);
          });

          estado.textContent = filtrados.length
            ? filtrados.length + " documento(s) encontrado(s)."
            : "Nenhum documento encontrado.";
        }

        busca.addEventListener("input", exibirDocumentos);

        filtroCategoria.addEventListener(
          "change",
          exibirDocumentos
        );

        exibirDocumentos();

      } catch (erro) {
        console.error(erro);
        estado.textContent =
          "Erro ao carregar o catálogo. Verifique documentos.json.";
      }
    }

    carregarDocumentos();
  </script>

</body>
</html>
