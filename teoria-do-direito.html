
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teoria do Direito</title>
  <link rel="stylesheet" href="direito.css">
</head>
<body>
  <header>
    <h1>Teoria do Direito</h1>
    <p>Minha biblioteca de estudos</p>
  </header>

  <main>
    <p><a href="direito.html">← Voltar ao currículo</a></p>

    
    
<h2>Biblioteca da disciplina</h2>

  <input
    type="search"
    id="busca-documentos"
    placeholder="Buscar nos documentos..."
    aria-label="Buscar documentos"
  >

  <section class="lista-documentos">

    <article class="documento">
      <h3>Introdução à Teoria do Direito</h3>
      <p><strong>Categoria:</strong> Texto de estudo</p>
      <p>Material introdutório da disciplina.</p>
      <a
        href="documentos/teoria-do-direito/introducao-teoria-do-direito.pdf"
        target="_blank"
        rel="noopener"
      >
        Abrir PDF
      </a>
    </article>

  </section>

  <script>
    const busca = document.getElementById("busca-documentos");
    const documentos = document.querySelectorAll(".documento");

    busca.addEventListener("input", () => {
      const termo = busca.value.toLowerCase();

      documentos.forEach((documento) => {
        documento.hidden =
          !documento.textContent.toLowerCase().includes(termo);
      });
    });
  </script>



    <h2>Resumos e anotações</h2>
    <p>Em breve, meus resumos aparecerão aqui.</p>
  </main>
</body>
</html>
